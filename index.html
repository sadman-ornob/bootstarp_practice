<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Flexbox Navbar & Hero</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  
  <nav class="navbar navbar-expand-lg bg-light border-bottom shadow-sm">
    <div class="container d-flex justify-content-between align-items-center py-2">
      
      <a class="navbar-brand fw-bold text-primary" href="#">MyPortfolio</a>

      
      <div class="d-flex gap-3">
        <a class="nav-link fw-semibold active" href="#">Home</a>
        <a class="nav-link fw-semibold" href="#">About</a>
        <a class="nav-link fw-semibold" href="#">Services</a>
        <a class="nav-link fw-semibold" href="#">Contact</a>
      </div>
    </div>
  </nav>

  
  <section class="bg-light py-5 min-vh-75 d-flex align-items-center">
    <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between gap-4 py-5">
      
      
      <div class="d-flex flex-column align-items-start text-center text-md-start">
        <span class="badge bg-primary-subtle text-primary mb-2 px-3 py-2 rounded-pill">Welcome to My World</span>
        <h1 class="display-4 fw-bold mb-3">Hi, I'm Sadman Arnab</h1>
        <p class="lead text-muted mb-4">
          I am a passionate Web Developer focused on building modern, responsive, and user-friendly web interfaces.
        </p>
        <div class="d-flex gap-3">
          <a href="#" class="btn btn-primary btn-lg px-4">Get Started</a>
          <a href="#" class="btn btn-outline-secondary btn-lg px-4">Contact Me</a>
        </div>
      </div>

      
      <div class="d-flex justify-content-center">
        <img src="https://via.placeholder.com/350x350" alt="Profile Image" class="img-fluid rounded-circle shadow">
      </div>

    </div>
  </section>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
